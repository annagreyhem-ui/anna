<html lang="en">
<head>

<!--
  QR EDITION: goodbye
  Built on the shared QR base — palette, grain, foot-scrim and .qr-legal
  come from qr-base.css. The typewriter is the same engine and look as the
  breathing-water/alice "Dear reader" letter. Alice's held breaths (the
  book's "…") are the pauses; nothing is typed for them.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Goodbye — Anna Greyhem</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/images/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/assets/images/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/css/qr-base.css">
<script src="../../assets/js/qr-viewport-fix.js"></script>
<script>
/* Preview-only safety net: some preview servers don't tokenise relative asset
   links, blocking the shared stylesheets. If the design tokens are missing,
   re-link them with the current auth token. In production this is a no-op. */
(function(){
  function fix(){
    if (getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()) return;
    var t = (location.search.match(/[?&]t=([^&]+)/) || [])[1];
    if (!t) return;
    var base = location.href.split('/how-life-feels/')[0] + '/';
    ['assets/fonts/fonts.css','assets/css/qr-base.css'].forEach(function(p){
      var l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = base + p + '?t=' + t; document.head.appendChild(l);
    });
  }
  if (document.readyState !== 'loading') fix();
  else document.addEventListener('DOMContentLoaded', fix);
})();
</script>
<style>
  body {
    font-family: var(--read);
    font-size: var(--read-immersive);
    line-height: 1.85;
  }

  /* ---- TYPEWRITER page (identical to breathing-water/alice) ---- */
  #typewriter-page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 40px; }
  #typewriter-text {
    max-width:36rem; width:88vw; white-space:pre-wrap; tab-size:6;
    font-family:var(--read); font-size:var(--read-immersive); line-height:1.85;
    color:var(--bone); min-height:200px;
  }

  /* typewriter — each glyph lands instantly, like a real keystroke */
  .tw-ch { opacity:0; animation:tw-in 0.09s linear forwards; }
  @keyframes tw-in { to { opacity:1; } }
  /* the signature, in Alice's hand */
  .tw-sig {
    font-family:var(--serif); font-style:italic; font-size:1.5em;
    color:#f6f2e8; letter-spacing:0.02em; line-height:1.4;
  }
  /* a real text caret — hard blink, no glow, solid while typing */
  .tw-caret {
    display:inline-block; width:2px; height:1.12em;
    margin-left:1px; vertical-align:-0.17em; border-radius:0.5px;
    background:var(--bone);
    animation:tw-blink 1.06s step-end infinite;
  }
  .tw-caret.typing { animation:none; opacity:1; }
  @keyframes tw-blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  @media (max-width:600px) { #typewriter-page { padding:60px 24px; } }

  /* Legal footer: keep it permanently legible (Impressum / Datenschutz
     must stay easily recognisable), still quiet against the dark.
     !important so it survives the preview safety-net re-appending qr-base.css. */
  .qr-legal { opacity:0.5 !important; }

  @media (prefers-reduced-motion: reduce) {
    .tw-ch { animation:none; opacity:1; }
    .tw-caret { animation:none; }
  }

  /* ---- the hole (reached by scrolling past the letter) ---- */
  #hole-scene { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; padding:80px 40px; opacity:0; transform:translateY(10px); transition:opacity 1.4s var(--ease), transform 1.4s var(--ease); }
  #hole-scene.in { opacity:1; transform:none; }

  #hole-hint { font-family:var(--mono); font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--bone-3); opacity:0; animation:hint-fade 2.2s ease forwards; animation-delay:0.8s; }
  @keyframes hint-fade { to { opacity:1; } }

  #hole {
    width:clamp(150px,42vw,220px); aspect-ratio:220/70; border-radius:50%; padding:0; margin:0; border:0; cursor:pointer;
    -webkit-appearance:none; -moz-appearance:none; appearance:none; outline:none;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 52%, rgba(201,196,184,0.32) 57%, rgba(0,0,0,0) 64%),
      radial-gradient(ellipse at 50% 55%, #030304 0%, var(--ink) 80%);
    box-shadow:0 0 clamp(45px,20vw,90px) rgba(158,36,56,0.28), inset 0 clamp(6px,3vw,12px) clamp(13px,6vw,26px) rgba(0,0,0,0.95);
    transition:box-shadow 0.5s var(--ease);
  }
  #hole:hover, #hole:focus-visible { box-shadow:0 0 clamp(55px,25vw,110px) rgba(158,36,56,0.4), inset 0 clamp(6px,3vw,12px) clamp(13px,6vw,26px) rgba(0,0,0,0.95); outline:none; }

  /* ---- the fall ---- */
  #fall-screen { position:fixed; inset:0; background:var(--ink); display:none; overflow:hidden; z-index:60; }
  #fall-screen.active { display:block; }
  #tunnel { position:absolute; left:50%; top:0; transform:translateX(-50%); width:220px; height:100%; }
  .ring { position:absolute; left:50%; top:45%; transform:translateX(-50%); border-radius:50%; border:1px solid rgba(238,234,224,0.07); animation:ring-zoom linear infinite; }
  @keyframes ring-zoom {
    0%   { opacity:0; width:40px; height:14px; margin-top:0; }
    20%  { opacity:0.35; }
    80%  { opacity:0.12; }
    100% { opacity:0; width:600px; height:200px; margin-top:-93px; }
  }
  .mote { position:absolute; border-radius:50%; animation:mote-fall linear infinite, mote-twinkle ease-in-out infinite; animation-fill-mode:backwards; }
  @keyframes mote-fall {
    0%   { transform:translateY(-10vh) scale(0.7); opacity:0; }
    15%  { opacity:0.9; }
    85%  { opacity:0.7; }
    100% { transform:translateY(110vh) scale(1.2); opacity:0; }
  }
  @keyframes mote-twinkle {
    0%, 100% { filter:brightness(1) saturate(1); }
    50%      { filter:brightness(2.2) saturate(1.6); }
  }

  #fall-text {
    position:absolute; left:50%; top:12vh; transform:translateX(-50%);
    width:min(34ch,82vw); z-index:20;
    display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start;
    column-gap:0.32em; row-gap:0.3em;
  }
  #fall-text .fw {
    font-family:var(--read); font-size:var(--read-immersive); line-height:1.4; color:var(--bone);
    display:inline-block; opacity:0; will-change:transform, opacity;
    animation:word-fall linear forwards;
  }
  @keyframes word-fall {
    0%   { transform:translateY(0) rotate(0deg) translateX(0); opacity:0; }
    10%  { opacity:1; }
    80%  { opacity:0.9; }
    100% { transform:translateY(var(--fy)) rotate(var(--rot)) translateX(var(--dx)); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #hole-scene { transition:none; }
    #fall-text .fw { animation:none; opacity:1; }
  }
</style>
</head>
<body data-screen-label="QR · Goodbye">

<span class="grain" aria-hidden="true"></span>

<div id="typewriter-page">
  <div id="typewriter-text" aria-live="polite"></div>
</div>

<section id="hole-scene">
  <button id="hole" aria-label="Fall"></button>
  <div id="hole-hint">there is a hole here</div>
</section>

<div id="fall-screen">
  <div id="tunnel"></div>
  <div id="fall-text"></div>
</div>

<nav class="qr-legal" aria-label="Legal">
  <a class="mark" href="https://annagreyhem.com/">Anna <em>Greyhem</em></a>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://annagreyhem.com/impressum/">Legal Notice</a>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://annagreyhem.com/datenschutz/">Privacy</a>
</nav>

<script>
(function () {
  "use strict";

  /* Blocks type in order, one paragraph each (\n\n between them). A \n inside
     a block is a soft line break. pauseAfter holds a beat once the block is
     typed — that is where the book's "…" go: breaths, not dots.
     sig = signature in Alice's italic hand. cont/midPause = type text, hold a
     breath (a "…"), then finish the sentence on the same line. */
  var twBlocks = [
    { text: 'Dear reader,' },
    { text: 'So you made it back.\nI watched you the whole time. Every page.' },
    { text: 'You were so close. I could almost touch you.\nBut you chose her.' },
    { text: 'Why?\nWhy didn\u2019t you want to play with me?', pauseAfter: 3200 },   // …
    { text: 'But I do understand. You are a moth.\nYou always fly towards the light. Even when it burns.' },
    { text: 'Enjoy being alive. While it lasts.', pauseAfter: 2600 },
    { sig: 'Alice' },
    { text: 'Oh, and', midPause: 1500, cont: ' when you meet death, give him a kiss from me.' }   // …
  ];

  var textEl = document.getElementById('typewriter-text');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var caret = document.createElement('span');
  caret.className = 'tw-caret';
  caret.setAttribute('aria-hidden', 'true');
  textEl.appendChild(caret);

  var settings = { min:34, max:72, punctPause:170, paraPause:920, thinkPause:1200 };

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rand(a, b) { return Math.random() * (b - a) + a; }

  function addChar(ch, cls) {
    var s = document.createElement('span');
    s.className = 'tw-ch' + (cls ? ' ' + cls : '');
    s.textContent = ch;
    textEl.insertBefore(s, caret);
    keepInView();
  }

  /* Follow the ink: once the caret slides under the transparent foot-scrim,
     ease the page down so the line being typed stays clear of the footer. */
  var footMargin = 250;   // foot-scrim (150px) + the quiet legal line, with breathing room
  function keepInView() {
    var overshoot = caret.getBoundingClientRect().bottom - (window.innerHeight - footMargin);
    if (overshoot > 1) window.scrollBy({ top: overshoot, behavior: 'smooth' });
  }

  /* Once the letter is finished, lift the final line a touch higher so the last
     sentence sits clearly above the transparent foot-scrim, not tucked behind it.
     The footer/scrim are position:fixed, so there is no natural content below the
     last line to scroll into — add a spacer first, then scroll. */
  function liftTail() {
    var chars = textEl.querySelectorAll('.tw-ch');
    if (!chars.length) return;
    var spacer = document.createElement('div');
    spacer.style.height = '7vh';
    spacer.setAttribute('aria-hidden', 'true');
    document.getElementById('typewriter-page').appendChild(spacer);
    requestAnimationFrame(function () {
      var lastBottom = chars[chars.length - 1].getBoundingClientRect().bottom;
      // lift the final line up, clear of the scrim
      var overshoot = lastBottom - (window.innerHeight * 0.78);
      if (overshoot > 1) window.scrollBy({ top: overshoot, behavior: 'smooth' });
    });
  }

  async function typeText(str, cls) {
    caret.classList.add('typing');
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      addChar(ch, cls);
      if (reduce) { continue; }
      var delay = rand(settings.min, settings.max);
      if (',.!?\u2026'.indexOf(ch) >= 0) delay += settings.punctPause;
      if (ch === '\n') delay += 100;
      await sleep(delay);
    }
    caret.classList.remove('typing');
  }

  async function run() {
    await sleep(reduce ? 0 : 900);
    for (var i = 0; i < twBlocks.length; i++) {
      var block = twBlocks[i];

      if (i !== 0) {
        addChar('\n'); addChar('\n');
        await sleep(reduce ? 0 : settings.paraPause);
      }
      if (i === 0) await sleep(reduce ? 0 : settings.thinkPause);

      if (block.text) await typeText(block.text);
      if (block.sig)  await typeText(block.sig, 'tw-sig');

      if (block.pauseAfter) await sleep(reduce ? 0 : block.pauseAfter);
      if (block.cont) {
        await sleep(reduce ? 0 : block.midPause || 1200);
        await typeText(block.cont);
      }
    }
    await sleep(reduce ? 0 : 1400);
    caret.remove();
    liftTail();
  }

  run();

  /* Reveal the hole when it scrolls into view */
  var holeScene = document.getElementById('hole-scene');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) holeScene.classList.add('in'); });
  }, { threshold: 0.4 });
  io.observe(holeScene);

  /* Click the hole → fall */
  document.getElementById('hole').addEventListener('click', function () {
    var fallScreen = document.getElementById('fall-screen');
    fallScreen.classList.add('active');

    var tunnel = document.getElementById('tunnel');
    for (var i = 0; i < 18; i++) {
      var ring = document.createElement('div');
      ring.className = 'ring';
      var duration = 1.2 + Math.random() * 0.8;
      var delay = i * 0.28;
      ring.style.cssText = 'top:' + (30 + Math.random() * 40) + '%;animation-duration:' + duration + 's;animation-delay:' + delay + 's;';
      tunnel.appendChild(ring);
    }

    var colors = ['#f5f0e6', '#8fb3c9', '#c9d6e0', '#d9a5b3'];
    for (var j = 0; j < 40; j++) {
      var m = document.createElement('div');
      m.className = 'mote';
      var size = 4 + Math.random() * 6;
      var x = 6 + Math.random() * 88;
      var md = 3 + Math.random() * 3;
      var mdelay = Math.random() * 3;
      var col = colors[Math.floor(Math.random() * colors.length)];
      var twd = 0.6 + Math.random() * 1.2;
      m.style.cssText = 'left:' + x + '%;top:' + (-10 + Math.random() * 20) + '%;width:' + size + 'px;height:' + size + 'px;background:' + col + ';box-shadow:0 0 ' + (size * 2) + 'px ' + col + ';opacity:' + (0.6 + Math.random() * 0.3) + ';animation-duration:' + md + 's,' + twd + 's;animation-delay:' + mdelay + 's,' + (Math.random() * 1) + 's;z-index:10;';
      fallScreen.appendChild(m);
    }

    var fallSentence = 'Uff. You scared me for a second. I thought this was a plot hole. Haha. Guess it\u2019s just a rabbit hole we are falling into.';
    var fallTextEl = document.getElementById('fall-text');
    fallSentence.split(' ').forEach(function (word, i) {
      var w = document.createElement('span');
      w.className = 'fw';
      w.textContent = word;
      var rot = -20 + Math.random() * 40;
      var dx = -35 + Math.random() * 70;
      var fy = 70 + Math.random() * 25;
      var dur = 4.5 + Math.random() * 2;
      var delay = 0.6 + i * 0.42;
      w.style.cssText = '--rot:' + rot + 'deg;--dx:' + dx + 'px;--fy:' + fy + 'vh;animation-duration:' + dur + 's;animation-delay:' + delay + 's;';
      fallTextEl.appendChild(w);
    });

    setTimeout(function () { window.location.href = '../../rabbit-hole/revealed/'; }, 17300);
  });

  /* LEGAL footer — brighten near the bottom edge */
  (function () {
    var legal = document.querySelector('.qr-legal');
    if (!legal) return;
    var nearT;
    function near() {
      legal.setAttribute('data-near', 'true');
      clearTimeout(nearT);
      nearT = setTimeout(function () { legal.setAttribute('data-near', 'false'); }, 2600);
    }
    function check(y) { if (y >= window.innerHeight - 120) near(); }
    window.addEventListener('pointermove', function (e) { check(e.clientY); }, { passive: true });
    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) check(e.touches[0].clientY);
    }, { passive: true });
  })();
})();
</script>

<!-- ═══════════ GoatCounter — page views + JS-error events ═══════════ -->
<script data-goatcounter="https://annagreyhem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
/* Report any uncaught JS error as a GoatCounter event, grouped under js-error/… */
(function () {
  function report(label) {
    try {
      var fire = function () {
        window.goatcounter.count({
          path:  'js-error' + location.pathname,
          title: String(label).slice(0, 240),
          event: true
        });
      };
      if (window.goatcounter && window.goatcounter.count) return fire();
      var n = 0, t = setInterval(function () {
        if (window.goatcounter && window.goatcounter.count) { clearInterval(t); fire(); }
        else if (++n > 30) clearInterval(t);
      }, 500);
    } catch (_) {}
  }
  window.addEventListener('error', function (e) {
    report((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('promise: ' + ((r && (r.message || r)) || 'unhandledrejection'));
  });
})();
</script>

</body>
</html>
