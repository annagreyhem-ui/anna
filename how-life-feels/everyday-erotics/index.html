<!--
  QR EDITION: everyday-erotics
  Built on the shared QR base — chrome-less, immersive, quiet by law.
  Scene: one poem, two readings. A slider tilts every line between
  her telling (deep blood red) and the other's (dusty rose). Each
  confession sits on its own indented line, so the words never jump —
  they only bleed in. Centre = the bare poem.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="/favicon.ico" sizes="any">

<link rel="icon" href="/assets/images/favicon-48.png" sizes="48x48" type="image/png">

<title>Everyday Erotics — Anna Greyhem</title>
<link rel="canonical" href="https://annagreyhem.com/how-life-feels/everyday-erotics/" />
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/css/qr-base.css">
<script src="../../assets/js/qr-viewport-fix.js"></script>
<script>
/* Preview-only safety net: some preview servers don't tokenise relative asset
   links, blocking the shared stylesheets. If the design tokens are missing,
   re-link them with the current auth token. In production this is a no-op. */
(function(){
  function fix(){
    if (getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()) return;
    var t = (location.search.match(/[?&]t=([^&]+)/) || [])[1];
    if (!t) return;
    var base = location.href.split('/how-life-feels/')[0] + '/';
    ['assets/fonts/fonts.css','assets/css/qr-base.css'].forEach(function(p){
      var l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = base + p + '?t=' + t; document.head.appendChild(l);
    });
  }
  if (document.readyState !== 'loading') fix();
  else document.addEventListener('DOMContentLoaded', fix);
})();
</script>
<style>
  /* the two voices of this scene — from the design-system palette */
  :root {
    --anna:  #c33149;   /* --cherry-3 (her telling, left) */
    --alice: #a87078;   /* --rose · dusty wall-rose (the other's, right) */
  }

  body {
    min-height: 100svh;
    /* room beneath the end-of-page footer so it settles just ABOVE the
       lowered slider when you scroll to the very bottom */
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  /* no accidental text selection while dragging the slider */
  body.dragging, body.dragging * {
    -webkit-user-select: none !important;
    user-select: none !important;
  }
  /* on-brand selection colour instead of the browser's default blue */
  ::selection { background: rgba(238, 234, 224, 0.16); color: inherit; }
  ::-moz-selection { background: rgba(238, 234, 224, 0.16); color: inherit; }

  /* solid ink veil so the fixed slider never floats over the poem */
  #foot-veil {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: clamp(168px, 24vh, 214px);
    background: linear-gradient(to top,
      var(--ink) 0%, var(--ink) 58%,
      rgba(10, 10, 12, 0.85) 78%, transparent 100%);
    pointer-events: none;
    z-index: 76;   /* above grain(70) + base scrim(75), below slider(78) + legal(80) */
  }

  /* ---------- POEM ---------- */
  .poem-stage {
    max-width: 600px;
    margin: 0 auto;
    padding: clamp(64px, 12vh, 112px) var(--gutter) clamp(188px, 26vh, 240px);
  }

  .story-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(31px, 5.4vw, 42px);
    letter-spacing: 0.01em;
    line-height: 1.16;
    color: var(--bone);
    margin: 0 0 clamp(44px, 7vh, 72px);
    text-wrap: balance;
  }
  /* brand signature: the cherry rule under the heading, as on the other QR pages.
     --rule shifts to rose (--alice) when the poem is dragged toward her. */
  .story-title { --rule: var(--cherry-3); }
  .story-title::after {
    content: ""; display: block; width: 56px; height: 2px;
    background: var(--rule); opacity: 0.85;
    margin-top: clamp(16px, 2.6vh, 22px);
    transition: background 0.6s ease;
  }
  #title-ext {
    opacity: 0;
    transition: opacity 0.6s ease, color 0.6s ease;
  }
  #title-ext .whisper { font-size: 0.58em; opacity: 0.8; }

  .poem {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .poem li {
    margin-bottom: clamp(20px, 3.2vh, 34px);
  }
  .base-line {
    display: block;
    font-family: var(--read);
    font-weight: 400;
    font-size: var(--read-immersive);
    line-height: 1.5;
    color: var(--bone);
    text-wrap: pretty;
  }
  .poem-ext {
    display: block;
    padding-left: 1.5em;
    margin-top: 0.15em;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(18px, 4.5vw, 22px);
    line-height: 1.5;
    min-height: 1.5em;               /* reserve the line so nothing reflows */
    opacity: 0;
    transition: opacity 0.5s ease, color 0.5s ease;
  }

  /* gentle load-in for the bare poem */
  .rise { opacity: 0; transform: translateY(9px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
  .rise.in { opacity: 1; transform: none; }
  .rise .poem-ext { opacity: 0; }    /* keep confessions hidden through the load-in */
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; transition: none; }
  }

  /* ---------- SLIDER ---------- */
  #slider-wrap {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 78;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;           /* generous grab band around the thin line */
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    pointer-events: auto;
  }
  #slider-track {
    position: relative;
    width: clamp(200px, 55vw, 340px);
    height: 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
    pointer-events: auto;
    touch-action: none;
  }
  #slider-track:focus { outline: none; }
  #slider-track:focus-visible { outline: 1px solid rgba(238, 234, 224, 0.45); outline-offset: 6px; border-radius: 3px; }
  #slider-line {
    position: absolute; left: 0; right: 0;
    height: 1px;
    background: rgba(238, 234, 224, 0.2);
  }
  #slider-line::before {
    content: "";
    position: absolute; left: 50%; top: -3px;
    width: 1px; height: 7px;
    transform: translateX(-50%);
    background: rgba(238, 234, 224, 0.28);
  }
  #slider-thumb {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(238, 234, 224, 0.78);
    left: 50%;
    transform: translateX(-50%);
    transition: background 0.2s ease;
    pointer-events: none;
  }
  #slider-hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--bone-3);
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 0.6em;
  }
  /* same behaviour as the tap/hold cues on the other QR pages: the drag hint
     hides on first interaction, reappears after idle, and breathes slowly.
     (qr-cue-breathe keyframes are defined in qr-base.css.) */
  #slider-hint.on {
    opacity: 1;
    animation: qr-cue-breathe 3.6s ease-in-out 1s infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    #slider-hint.on { animation: none; }
  }

  /* This page only (exception): the legal footer sits at the TRUE end of the
     document, in normal flow after the poem. Scroll to the very bottom and it
     appears just ABOVE the (lowered) slider — it never floats over the reading. */
  .qr-legal {
    position: relative !important;
    z-index: 79;
    transform: none !important;
    left: auto !important; right: auto !important; bottom: auto !important;
    opacity: 0.5 !important;
    display: flex !important;
    justify-content: center !important;
    width: 100% !important;
    padding: 0 var(--gutter) !important;
  }
</style>
</head>
<body data-screen-label="QR · Everyday Erotics">

<span class="grain" aria-hidden="true"></span>
<div id="foot-veil" aria-hidden="true"></div>

<div class="poem-stage">
  <h1 class="story-title rise" id="title">Everyday Erotics<span id="title-ext"></span></h1>

  <ul class="poem">
    <li class="rise"><span class="base-line">Whispers in the dark</span><span class="poem-ext" id="e0"></span></li>
    <li class="rise"><span class="base-line">A kiss in a dream</span><span class="poem-ext" id="e1"></span></li>
    <li class="rise"><span class="base-line">A bubble bath, candlelit</span><span class="poem-ext" id="e2"></span></li>
    <li class="rise"><span class="base-line">Cold water on my face</span><span class="poem-ext" id="e3"></span></li>
    <li class="rise"><span class="base-line">A bottle of Merlot</span><span class="poem-ext" id="e4"></span></li>
    <li class="rise"><span class="base-line">A perfume of vanilla and darkness</span><span class="poem-ext" id="e5"></span></li>
    <li class="rise"><span class="base-line">His scent</span><span class="poem-ext" id="e6"></span></li>
    <li class="rise"><span class="base-line">His eyes on me</span><span class="poem-ext" id="e7"></span></li>
    <li class="rise"><span class="base-line">His touch</span><span class="poem-ext" id="e8"></span></li>
    <li class="rise"><span class="base-line">My touch</span><span class="poem-ext" id="e9"></span></li>
  </ul>
</div>

<div id="slider-wrap">
  <div id="slider-track" role="slider" tabindex="0"
       aria-label="Shift the poem between the two tellings"
       aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
    <div id="slider-line"></div>
    <div id="slider-thumb"></div>
  </div>
  <div id="slider-hint">&larr;&nbsp;drag&nbsp;&rarr;</div>
</div>

<nav class="qr-legal" aria-label="Legal">
  <a class="mark" href="https://annagreyhem.com/">Anna <em>Greyhem</em></a>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://annagreyhem.com/impressum/">Legal Notice</a>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://annagreyhem.com/datenschutz/">Privacy</a>
</nav>

<script>
(function () {
  "use strict";

  /* Left — her own telling. Right — the other woman's. */
  var ext_left = [
    'keep me from sleeping',
    'he never mentions',
    'with her',
    'to bring me back',
    'still sitting there',
    "isn't mine",
    'stays on her',
    'searching for her',
    'colder than before',
    "holds him. I won't let go."
  ];
  var ext_right = [
    'keep me from sleeping',
    'I never mention',
    'with her',
    'to bring me back',
    'still sitting there',
    "won't let me forget her",
    'makes me feel guilty',
    'naked',
    'I no longer feel',
    'makes her moan'
  ];

  var titleEl  = document.getElementById('title');
  var titleExt = document.getElementById('title-ext');
  var track    = document.getElementById('slider-track');
  var thumb    = document.getElementById('slider-thumb');
  var hint     = document.getElementById('slider-hint');
  /* the drag hint stays visible the whole time (it reads better this way);
     it just breathes slowly via #slider-hint.on in the page CSS. */
  var exts     = [];
  for (var k = 0; k < 10; k++) exts.push(document.getElementById('e' + k));

  var loaded = false;   // confessions stay hidden until the load-in finishes
  var value  = 0;

  function render(val) {
    val = Math.max(-1, Math.min(1, val));
    value = val;

    var pct = (val + 1) / 2 * 100;
    thumb.style.left = pct + '%';
    track.setAttribute('aria-valuenow', Math.round(val * 100));

    var leftStr  = val < 0 ? -val : 0;
    var rightStr = val > 0 ?  val : 0;

    for (var i = 0; i < 10; i++) {
      var el = exts[i];
      if (!loaded) { el.style.opacity = 0; continue; }
      if (val < 0) {
        el.textContent = ext_left[i];
        el.style.color = 'var(--anna)';
        el.style.opacity = leftStr;
      } else if (val > 0) {
        el.textContent = ext_right[i];
        el.style.color = 'var(--alice)';
        el.style.opacity = rightStr;
      } else {
        el.style.opacity = 0;
      }
    }

    if (val < 0) {
      titleExt.style.color = 'var(--anna)';
      titleExt.style.opacity = loaded ? leftStr : 0;
      titleExt.textContent = ' with her';
    } else if (val > 0) {
      titleExt.style.color = 'var(--alice)';
      titleExt.style.opacity = loaded ? rightStr : 0;
      titleExt.textContent = ' with her';
    } else {
      titleExt.style.opacity = 0;
    }

    titleEl.style.setProperty('--rule', val > 0 ? 'var(--alice)' : 'var(--cherry-3)');

    var rgb = val < 0 ? '195,49,73' : '168,112,120';
    var glow = Math.max(leftStr, rightStr);
    thumb.style.background = glow
      ? 'rgba(' + rgb + ',' + (0.78 + 0.22 * glow) + ')'
      : 'rgba(238,234,224,0.78)';
  }

  function valFromClientX(clientX) {
    var rect = track.getBoundingClientRect();
    var p = (clientX - rect.left) / rect.width;
    return Math.max(-1, Math.min(1, p * 2 - 1));
  }

  /* ---- pointer drag (mouse + touch, unified) — the whole slider band is grabbable ---- */
  var wrap = document.getElementById('slider-wrap');
  var dragging = false;

  function point(e) { return e.touches ? e.touches[0] : e; }
  /* If someone reaches for the slider before the load-in has finished, don't
     swallow the interaction — unlock the confessions right away. */
  function unlock() { if (!loaded) { loaded = true; hint.classList.add('on'); } }
  function beginDrag() { unlock(); dragging = true; document.body.classList.add('dragging'); }
  function endDrag()   { dragging = false; document.body.classList.remove('dragging'); }

  wrap.addEventListener('pointerdown', function (e) {
    beginDrag();
    if (wrap.setPointerCapture) { try { wrap.setPointerCapture(e.pointerId); } catch (_) {} }
    render(valFromClientX(e.clientX));
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    render(valFromClientX(e.clientX));
  });
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);

  /* touch/mouse fallback for browsers without pointer events */
  if (!window.PointerEvent) {
    wrap.addEventListener('touchstart', function (e) { beginDrag(); render(valFromClientX(point(e).clientX)); }, { passive: true });
    wrap.addEventListener('touchmove',  function (e) { if (dragging) render(valFromClientX(point(e).clientX)); }, { passive: true });
    wrap.addEventListener('touchend',   endDrag, { passive: true });
    wrap.addEventListener('mousedown',  function (e) { beginDrag(); render(valFromClientX(e.clientX)); e.preventDefault(); });
    document.addEventListener('mousemove', function (e) { if (dragging) render(valFromClientX(e.clientX)); });
    document.addEventListener('mouseup',   endDrag);
  }

  /* ---- keyboard ---- */
  track.addEventListener('keydown', function (e) {
    var step = 0.2;
    unlock();
    if (e.key === 'ArrowLeft')  { render(value - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { render(value + step); e.preventDefault(); }
    if (e.key === 'Home')       { render(-1); e.preventDefault(); }
    if (e.key === 'End')        { render(1);  e.preventDefault(); }
    if (e.key === '0')          { render(0);  e.preventDefault(); }
  });

  /* ---- load-in: stagger the bare poem, then invite the drag ---- */
  window.addEventListener('load', function () {
    var rows = document.querySelectorAll('.rise');
    rows.forEach(function (r, idx) {
      setTimeout(function () { r.classList.add('in'); }, 140 + idx * 85);
    });
    setTimeout(function () {
      loaded = true;
      hint.classList.add('on');
    }, 140 + rows.length * 85 + 700);
  });

  render(0);

  /* The legal footer sits in normal flow at the very end of the page and needs
     no script — it simply comes into view just above the lowered slider at max scroll. */
})();
</script>

<!-- ═══════════ GoatCounter — page views + JS-error events ═══════════ -->
<script data-goatcounter="https://annagreyhem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
/* Report any uncaught JS error as a GoatCounter event, grouped under js-error/… */
(function () {
  function report(label) {
    try {
      var fire = function () {
        window.goatcounter.count({
          path:  'js-error' + location.pathname,
          title: String(label).slice(0, 240),
          event: true
        });
      };
      if (window.goatcounter && window.goatcounter.count) return fire();
      var n = 0, t = setInterval(function () {
        if (window.goatcounter && window.goatcounter.count) { clearInterval(t); fire(); }
        else if (++n > 30) clearInterval(t);
      }, 500);
    } catch (_) {}
  }
  window.addEventListener('error', function (e) {
    report((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('promise: ' + ((r && (r.message || r)) || 'unhandledrejection'));
  });
})();
</script>

</body>
</html>
