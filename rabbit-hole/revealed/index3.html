<script>
/* Preview-only safety net: some preview servers don't tokenise relative asset
   links, blocking the shared stylesheet and desk images. If tokens are missing,
   re-link/re-source them with the current auth token. In production this is a no-op. */
(function(){
  var t = (location.search.match(/[?&]t=([^&]+)/) || [])[1];
  if (!t) return;
  var base = location.href.split('/rabbit-hole/')[0] + '/';
  function fixCSS(){
    if (getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()) return;
    var l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = base + 'assets/fonts/fonts.css?t=' + t; document.head.appendChild(l);
  }
  function fixImg(img){
    img.addEventListener('error', function retry(){
      img.removeEventListener('error', retry);
      img.src = base + img.getAttribute('data-src') + '?t=' + t;
    });
  }
  document.addEventListener('DOMContentLoaded', function(){
    fixCSS();
    document.querySelectorAll('img[data-src]').forEach(fixImg);
  });
})();
</script>
<style>

var tapeAudioCtx, tapeOsc, tapeGain;
function tapeAudioReady(cb){
  if (!tapeAudioCtx) tapeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (tapeAudioCtx.state === 'suspended') { tapeAudioCtx.resume().then(cb).catch(cb); }
  else { cb(); }
}
var tapeAudioUrl = '../../assets/audio/tape-recording.mp3';
var tapeBuffer = null, tapeBufferLoading = null, tapeSource = null;
var tapeOffset = 0, tapeStartedAt = 0, tapeManualStop = false;
function tapeLoadBuffer(){
  if (tapeBuffer) return Promise.resolve(tapeBuffer);
  if (!tapeBufferLoading) {
    tapeBufferLoading = fetch(tapeAudioUrl).then(function(r){ return r.arrayBuffer(); })
      .then(function(buf){ return tapeAudioCtx.decodeAudioData(buf); })
      .then(function(decoded){ tapeBuffer = decoded; return decoded; });
  }
  return tapeBufferLoading;
}
function tapeAudioResume(){
  if (!tapeAudioCtx) tapeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (tapeAudioCtx.state === 'suspended') tapeAudioCtx.resume();
  tapeLoadBuffer().then(function(buffer){
    if (tapeSource) { tapeManualStop = true; try { tapeSource.stop(); } catch(e){} }
    tapeSource = tapeAudioCtx.createBufferSource();
    tapeSource.buffer = buffer;
    var tapeVoiceGain = tapeAudioCtx.createGain();
    tapeVoiceGain.gain.value = 2.6;
    var tapeCompressor = tapeAudioCtx.createDynamicsCompressor();
    tapeCompressor.threshold.value = -28;
    tapeCompressor.knee.value = 24;
    tapeCompressor.ratio.value = 10;
    tapeCompressor.attack.value = 0.003;
    tapeCompressor.release.value = 0.25;
    tapeSource.connect(tapeVoiceGain).connect(tapeCompressor).connect(tapeAudioCtx.destination);
    tapeManualStop = false;
    var offset = tapeOffset % buffer.duration;
    tapeStartedAt = tapeAudioCtx.currentTime - offset;
    tapeSource.onended = function(){
      if (tapeManualStop) return;
      tapeOffset = 0;
      tapeFrame.classList.remove('is-playing');
      if (tapeOsc) { var t = tapeAudioCtx.currentTime; tapeGain.gain.linearRampToValueAtTime(0.0001, t + 0.2); tapeOsc.stop(t + 0.25); tapeOsc = null; }
      tapeClickSound();
    };
    tapeSource.start(0, offset);
  }).catch(function(){});
}
function tapeAudioHold(){
  if (!tapeSource) return;
  tapeManualStop = true;
  tapeOffset = tapeAudioCtx.currentTime - tapeStartedAt;
  try { tapeSource.stop(); } catch(e){}
  tapeSource = null;
}

function tapeClickSound(){
  tapeAudioReady(function(){
    var t = tapeAudioCtx.currentTime;
    var dur = 0.045;
    var buf = tapeAudioCtx.createBuffer(1, Math.floor(tapeAudioCtx.sampleRate * dur), tapeAudioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) { data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3); }
    var noise = tapeAudioCtx.createBufferSource();
    noise.buffer = buf;
    var filter = tapeAudioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2200;
    filter.Q.value = 0.25;
    var clickGain = tapeAudioCtx.createGain();
    clickGain.gain.value = 0.32;
    noise.connect(filter).connect(clickGain).connect(tapeAudioCtx.destination);
    noise.start(0);
  });
}
function tapeSoundStart(){
  var unlock = document.getElementById('silentUnlock');
  if (unlock) { unlock.play().catch(function(){}); }
  tapeClickSound();
  tapeAudioReady(function(){
    tapeOsc = tapeAudioCtx.createOscillator();
    tapeGain = tapeAudioCtx.createGain();
    tapeOsc.type = 'sine';
    tapeOsc.frequency.value = 170;
    tapeGain.gain.value = 0.0001;
    tapeOsc.connect(tapeGain).connect(tapeAudioCtx.destination);
    tapeOsc.start();
    tapeGain.gain.linearRampToValueAtTime(0.0225, tapeAudioCtx.currentTime + 0.3);
  });
}
function tapeSoundStop(){
  tapeClickSound();
  if (!tapeOsc) return;
  var t = tapeAudioCtx.currentTime;
  tapeGain.gain.linearRampToValueAtTime(0.0001, t + 0.2);
  tapeOsc.stop(t + 0.25);
  tapeOsc = null;
}
function tapeRewindSound(){
  tapeAudioReady(function(){
  var t = tapeAudioCtx.currentTime;
  var dur = 0.9;
  var osc = tapeAudioCtx.createOscillator();
  var osc2 = tapeAudioCtx.createOscillator();
  var lfo = tapeAudioCtx.createOscillator();
  var lfoGain = tapeAudioCtx.createGain();
  var filter = tapeAudioCtx.createBiquadFilter();
  var gain = tapeAudioCtx.createGain();
  osc.type = 'sawtooth';
  osc2.type = 'square';
  osc2.detune.value = -1200;
  lfo.type = 'sine';
  lfo.frequency.value = 24;
  lfoGain.gain.value = 35;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);
  lfoGain.connect(osc2.frequency);
  osc.frequency.setValueAtTime(240, t);
  osc.frequency.exponentialRampToValueAtTime(950, t + dur);
  osc2.frequency.setValueAtTime(240, t);
  osc2.frequency.exponentialRampToValueAtTime(950, t + dur);
  filter.type = 'bandpass';
  filter.frequency.value = 1100;
  filter.Q.value = 0.9;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.09, t + 0.06);
  gain.gain.linearRampToValueAtTime(0.09, t + dur - 0.12);
  gain.gain.linearRampToValueAtTime(0.0001, t + dur);
  osc.connect(filter);
  osc2.connect(filter);
  filter.connect(gain).connect(tapeAudioCtx.destination);
  lfo.start(0);
  osc.start(0);
  osc2.start(0);
  lfo.stop(t + dur + 0.05);
  osc.stop(t + dur + 0.05);
  osc2.stop(t + dur + 0.05);
  });
}

/* Touchpoints: one dot per object. They appear shortly after the reader is back
   at the desk and step aside while an object is open. */
var dotsLayer = document.getElementById('dots');
var dotEls = [];
var dotsTimer;
var dotsSeen = false;
function buildDots(){
  if (dotEls.length) return;
  document.querySelectorAll('.hotspot:not(.off):not(.on):not(.no-dot)').forEach(function(spot){
    var d = document.createElement('span');
    d.className = 'dot';
    dotEls.push({ el: d, spot: spot });
    dotsLayer.appendChild(d);
  });
  placeDots();
  window.addEventListener('resize', placeDots);
}
function placeDots(){
  var box = stage.getBoundingClientRect();
  if (!box.width) return;
  dotEls.forEach(function(pair){
    var r = pair.spot.getBoundingClientRect();
    if (!r.width) return;
    pair.el.style.left = ((r.left - box.left + r.width / 2) / box.width * 100) + '%';
    pair.el.style.top = ((r.top - box.top + r.height / 2) / box.height * 100) + '%';
  });
}
function showDots(){
  dotsSeen = true;
  buildDots();
  placeDots();
  dotEls.forEach(function(pair){ pair.el.classList.add('show'); });
}
/* First arrival at the desk gets the cues quickly; on every return the reader
   has had a chance to explore, so they hold back. */
function scheduleDots(){
  clearTimeout(dotsTimer);
  if (stage.classList.contains('lit-on')) dotsTimer = setTimeout(showDots, dotsSeen ? 5000 : 1500);
}
function hideDots(){
  clearTimeout(dotsTimer);
  dotEls.forEach(function(pair){ pair.el.classList.remove('show'); });
}
function retireDots(){ hideDots(); }

function loadSpotify(){
  var wrap = document.getElementById('spotifyWrap');
  if (wrap.dataset.loaded === 'true') return;
  wrap.dataset.loaded = 'true';
  var inner = document.createElement('div');
  inner.className = 'spotify-wrap-inner';
  /* The embed paints white until Spotify's own dark UI arrives — hold a black
     layer over it until then. */
  var loading = document.createElement('div');
  loading.className = 'spotify-loading';
  loading.innerHTML = '<i></i><i></i><i></i>';
  var iframe = document.createElement('iframe');
  iframe.src = 'https://open.spotify.com/embed/playlist/0OX1wy1RCRzPo2Wz6B0aZv?utm_source=generator&theme=0';
  iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
  iframe.style.border = '0';
  inner.appendChild(iframe);
  var settle;
  iframe.addEventListener('load', function(){
    clearTimeout(settle);
    settle = setTimeout(function(){
      loading.classList.add('done');
      setTimeout(function(){ if (loading.parentNode) loading.parentNode.removeChild(loading); }, 600);
    }, 500);
  });
  setTimeout(function(){
    loading.classList.add('done');
    setTimeout(function(){ if (loading.parentNode) loading.parentNode.removeChild(loading); }, 600);
  }, 6000);
  wrap.innerHTML = '';
  wrap.appendChild(inner);
  wrap.appendChild(loading);
  fitSpotify();
}
function fitSpotify(){
  var wrap = document.getElementById('spotifyWrap');
  var inner = wrap && wrap.querySelector('.spotify-wrap-inner');
  if (!inner) return;
  var box = wrap.getBoundingClientRect();
  if (!box.width) return;
  var k = 0.6667;
  inner.style.width = (box.width / k) + 'px';
  inner.style.height = (box.height / k) + 'px';
  inner.style.transform = 'scale(' + k + ')';
}

/* Pinch-zoom does not reset on its own. Briefly pinning maximum-scale returns
   the browser to 1x — reliable on Android Chrome; iOS Safari ignores the
   attribute for accessibility, so treat this as a nudge, not a guarantee. */
var viewportMeta = document.querySelector('meta[name="viewport"]');
var viewportBase = viewportMeta ? viewportMeta.getAttribute('content') : '';
var zoomResetTimer;
function resetZoom(){
  if (!viewportMeta) return;
  if (window.visualViewport && window.visualViewport.scale <= 1.01) return;
  clearTimeout(zoomResetTimer);
  viewportMeta.setAttribute('content', viewportBase + ', maximum-scale=1');
  zoomResetTimer = setTimeout(function(){ viewportMeta.setAttribute('content', viewportBase); }, 500);
}

});
/* 5. Keep hidden overlays out of the tab order — opacity:0 alone stays focusable. */
(function(){
  var overlays = document.querySelectorAll('.phone-overlay, .plant-overlay, .manuscript-overlay, .notes-overlay, .gallery-overlay, .laptop-overlay, .notebook-overlay, .newspaper-overlay, .tape-overlay, .polaroids-overlay');
  function syncInert(el){
    var open = el.classList.contains('show');
    el.setAttribute('aria-hidden', open ? 'false' : 'true');
    el.querySelectorAll('button, a, iframe').forEach(function(node){
      if (open) node.removeAttribute('tabindex'); else node.setAttribute('tabindex', '-1');
    });
  }
  overlays.forEach(function(el){
    syncInert(el);
    new MutationObserver(function(){ syncInert(el); }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
})();

document.addEventListener('touchend', function(){
  var kickAudio = document.getElementById('silentUnlock');
  if (kickAudio) { kickAudio.play().catch(function(){}); }
  if (!tapeAudioCtx) tapeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var primeUnlock = function(){
    var dur = 0.4;
    var len = Math.floor(tapeAudioCtx.sampleRate * dur);
    var buf = tapeAudioCtx.createBuffer(1, len, tapeAudioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { data[i] = (Math.random() * 2 - 1) * 0.002; }
    var src = tapeAudioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(tapeAudioCtx.destination);
    src.start(0);
  };
  if (tapeAudioCtx.state === 'suspended') { tapeAudioCtx.resume().then(primeUnlock).catch(primeUnlock); }
  else { primeUnlock(); }
}, { once: true, passive: true });

  var nearT;
  function near() {
    legal.setAttribute('data-near', 'true');
    clearTimeout(nearT);
    nearT = setTimeout(function () { legal.setAttribute('data-near', 'false'); }, 2600);
  }
  function check(y) { if (y >= window.innerHeight - 120) near(); }
  window.addEventListener('pointermove', function (e) { check(e.clientY); }, { passive: true });
  window.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) check(e.touches[0].clientY);
  }, { passive: true });
})();

<script data-goatcounter="https://annagreyhem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
/* Report any uncaught JS error as a GoatCounter event, grouped under js-error/… */
(function () {
  function report(label) {
    try {
      var fire = function () {
        window.goatcounter.count({
          path:  'js-error' + location.pathname,
          title: String(label).slice(0, 240),
          event: true
        });
      };
      if (window.goatcounter && window.goatcounter.count) return fire();
      var n = 0, t = setInterval(function () {
        if (window.goatcounter && window.goatcounter.count) { clearInterval(t); fire(); }
        else if (++n > 30) clearInterval(t);
      }, 500);
    } catch (_) {}
  }
  window.addEventListener('error', function (e) {
    report((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('promise: ' + ((r && (r.message || r)) || 'unhandledrejection'));
  });
})();
</script>
