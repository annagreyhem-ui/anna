<style>

@keyframes ring-zoom{0%{opacity:0;width:40px;height:14px;margin-top:0}20%{opacity:.35}80%{opacity:.12}100%{opacity:0;width:600px;height:200px;margin-top:-93px}}

<script>
var target = new Date('2026-09-26T00:00:00Z');
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  var diff = target - new Date();
  if (diff < 0) diff = 0;
  var d = Math.floor(diff / 86400000);
  var h = Math.floor(diff % 86400000 / 3600000);
  var m = Math.floor(diff % 3600000 / 60000);
  var s = Math.floor(diff % 60000 / 1000);
  document.getElementById('d').textContent = pad(d);
  document.getElementById('h').textContent = pad(h);
  document.getElementById('m').textContent = pad(m);
  document.getElementById('s').textContent = pad(s);
}
tick(); setInterval(tick, 1000);

var form = document.getElementById('gateForm');
var pw = document.getElementById('pw');
var msg = document.getElementById('msg');
var fallScreen = document.getElementById('fall-screen');
var FULL = 12;
var DIR = location.pathname.replace(/[^/]*$/, '');
var BASE = /\/rabbit-hole\/$/.test(DIR) ? '' : 'rabbit-hole/';
var K1 = ['9096b764d0c7b57b8660d30bdaae124b186f73d006b5448a593cb11ea5158757','146635d9c07c5ca29bba721938a4307bde698b2271e458810fb565b44f5d8512','bddc7822d0311bb24d9f0d9713fb00ed95d7466a37e43ca85f4df6d88f3cf7dd','21c8005f30b47a304dc61d1d0ac60316ac3c8af2e43c1a63e58e73c22a5e9c6b','c3f5b05b4d1a509e917ccb8cba96854405e48b956882c644e66e38493ec4a41b','d096dc3e0ac465159180e5de1d5afef3167bf5b5e07618e25d4f76bf8f3c6e1d','cb5c7ffd47fb7b0b3665840cc9c71afd4a5c45d6ae93d4f0efa9d4f97933d013','0f0d98facb01e8bfccd42324418169b71d1d47591fe3afc6f42d815b6c59ebfe'];
var K = ['9096b764d0c7b57b8660d30bdaae124b186f73d006b5448a593cb11ea5158757','12bd42dd8d55dec60fdcec7ec257a9c021fe9a44da34dfd315fa0306069fb607','ab40781f487174737bf479715dfb1f6b08b19af8e1e52f53c69f4d57de2ecb2c','6061d9260d7a9abb8e2a2e3c210b9e23ed245dfab6e8c3dcf83bba1a740b55c0','2ecf9000e7c7e38e047fea808b9b5831071a65ea5f9afdf08848c544ce58bdb2','399a9454edac13cf8609548d468f8c2bb61165057432218471679d10a8bdd0d3','06cf24d4c32525b5a84bc2ac9b3083bcdd61674cb208debdf166377bb2dc7648','dc78f1df016168a83996ec7f10815a031fab57e135a8b5a771561ba57311d278','84a7f9636fc97c3ea61a20bd9ac5375bad911b6ce0b83f3c178a70cc4c192d04','f65316fcbc0b70e9801bea34e97390958919fd97896841caf1cc3ab98c434284','1c61491980d13f72ce06823139587f6f0a970ebf44015915e796d0884e8d2bab','68b51c1c3cf155e8004c870c0ee8cd690ea6c72ce77dd01e0c403f3dd46fda52'];
function digest(v){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode('ag:' + v)).then(function(b){
    return [].map.call(new Uint8Array(b), function(x){ return x.toString(16).padStart(2,'0'); }).join('');
  });
}
function startFall(folder){
  fallScreen.classList.add('active');
  var tunnel = document.getElementById('tunnel');
  for (var i = 0; i < 18; i++) {
    var ring = document.createElement('div');
    ring.className = 'ring';
    var duration = 1.2 + Math.random() * 0.8;
    var delay = i * 0.28;
    ring.style.cssText = 'top:' + (30 + Math.random() * 40) + '%;animation-duration:' + duration + 's;animation-delay:' + delay + 's;';
    tunnel.appendChild(ring);
  }
  var colors = ['#f5f0e6', '#8fb3c9', '#c9d6e0', '#d9a5b3'];
  for (var j = 0; j < 40; j++) {
    var m = document.createElement('div');
    m.className = 'mote';
    var size = 4 + Math.random() * 6;
    var x = 6 + Math.random() * 88;
    var md = 3 + Math.random() * 3;
    var mdelay = Math.random() * 3;
    var col = colors[Math.floor(Math.random() * colors.length)];
    var twd = 0.6 + Math.random() * 1.2;
    m.style.cssText = 'left:' + x + '%;top:' + (-10 + Math.random() * 20) + '%;width:' + size + 'px;height:' + size + 'px;background:' + col + ';box-shadow:0 0 ' + (size * 2) + 'px ' + col + ';opacity:' + (0.6 + Math.random() * 0.3) + ';animation-duration:' + md + 's,' + twd + 's;animation-delay:' + mdelay + 's,' + (Math.random() * 1) + 's;z-index:10;';
    fallScreen.appendChild(m);
  }
  var fallSentence = 'Oops. You just fell down the rabbit hole.';
  var fallTextEl = document.getElementById('fall-text');
  fallSentence.split(' ').forEach(function (word, i) {
    var w = document.createElement('span');
    w.className = 'fw';
    w.textContent = word;
    var rot = -20 + Math.random() * 40;
    var dx = -35 + Math.random() * 70;
    var fy = 70 + Math.random() * 25;
    var dur = 4.5 + Math.random() * 2;
    var delay2 = 0.6 + i * 0.42;
    w.style.cssText = '--rot:' + rot + 'deg;--dx:' + dx + 'px;--fy:' + fy + 'vh;animation-duration:' + dur + 's;animation-delay:' + delay2 + 's;';
    fallTextEl.appendChild(w);
  });
  setTimeout(function () { window.location.href = folder + '/index.html'; }, 9500);
}
function reject(){
  pw.classList.add('err','shake');
  msg.textContent = 'incorrect.';
  msg.classList.add('show');
  setTimeout(function(){ pw.classList.remove('shake'); }, 300);
}
form.addEventListener('submit', function(e){
  e.preventDefault();
  var val = pw.value.trim().toLowerCase();
  if (!/^[a-z]{1,24}$/.test(val)) { reject(); return; }
  digest(val).then(function(hex){
    if (val.length === 1) {
      if (K1.indexOf(hex) === -1) { reject(); return; }
      sessionStorage.setItem('ag-fell-revealed-h', '1');
      startFall(BASE + 'revealed-h');
      return;
    }
    if (K.indexOf(hex) === -1) { reject(); return; }
    var full = val.length === FULL;
    var name = full ? 'revealed' : 'revealed-' + val;
    var folder = BASE + name;
    if (full) localStorage.setItem('ag-unlocked', 'true');
    sessionStorage.setItem('ag-fell-' + name, '1');
    startFall(folder);
  }).catch(function(){ reject(); });
});
pw.addEventListener('input', function(){
  pw.classList.remove('err');
  msg.classList.remove('show');
});
</script>
