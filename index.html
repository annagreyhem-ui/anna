<!doctype html>
<html lang="de">
<head>
<!-- Sentry error monitoring -->
<script src="https://js-de.sentry-cdn.com/d1efa12f446c9731326431bcea7d044e.min.js" crossorigin="anonymous"></script>
<script>
  Sentry.onLoad(function () {
    Sentry.init({ release: "anna-greyhem-website@1.0.0" });

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Anna Greyhem</title>
<meta name="description" content="Anna Greyhem — coming soon." />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{--ink:#0a0a0c;--bone:#eeeae0;--bone-2:#c9c4b8;--bone-3:#8a8478;--bone-4:#2a2823;--cherry:#9e2438;--serif:'Cormorant Garamond','EB Garamond',Garamond,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);min-height:100vh;-webkit-font-smoothing:antialiased}
body{font-family:var(--serif);display:flex;flex-direction:column;align-items:center;min-height:100vh;text-align:center;position:relative;overflow-x:hidden}
.content{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,7vh,56px);padding:24px;width:100%}
.mark{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-3)}
.tagline{font-family:var(--serif);font-size:clamp(20px,3.4vw,28px);font-style:normal;font-weight:400;color:var(--bone-2);line-height:1.6;max-width:480px}
.countdown{display:flex;gap:clamp(10px,4vw,56px);flex-wrap:nowrap}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px}
.unit .num{font-size:clamp(40px,9vw,84px);font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.unit .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-3)}
.countdown .sep{font-size:clamp(40px,9vw,84px);color:var(--bone-4);align-self:flex-start;margin-top:2px}
.gate{display:flex;flex-direction:column;align-items:center;gap:6px}
.gate-row{display:flex;align-items:baseline;gap:14px}
.gate input{background:transparent;border:0;border-bottom:1px solid var(--bone-4);color:var(--bone);font-family:var(--serif);font-style:italic;font-size:20px;letter-spacing:.04em;text-align:center;padding:8px 2px 10px;width:min(200px,58vw);outline:none;transition:border-color .3s ease}
.gate input::placeholder{color:var(--bone-3);opacity:.6}
.gate input:focus{border-color:var(--bone-3)}
.gate input.err{border-color:var(--cherry)}
.gate button{background:none;border:0;color:var(--bone-3);font-family:var(--serif);font-style:italic;font-size:22px;line-height:1;padding:0 0 10px;cursor:pointer;flex-shrink:0;transition:color .3s ease,transform .3s ease}
.gate button:hover,.gate button:active{color:var(--bone);transform:translateX(3px)}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--bone-3);opacity:.4;margin-top:8px}
.msg{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--cherry);min-height:14px;opacity:0;transition:opacity .3s ease}
.msg.show{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s ease}
footer.site-footer{flex-shrink:0;text-align:center;padding:24px 18px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 14px}
footer.site-footer .foot-mark{font-family:var(--serif);font-weight:300;font-size:16px;color:var(--bone);text-decoration:none;transition:color .4s ease}
footer.site-footer .foot-mark em{font-style:italic}
footer.site-footer .foot-mark:hover{color:#fff}
footer.site-footer .foot-legal{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center}
footer.site-footer .foot-legal a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3);text-decoration:none;transition:color .4s ease}
footer.site-footer .foot-legal a span{border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .4s ease}
footer.site-footer .foot-legal a:hover{color:var(--bone-2)}
footer.site-footer .foot-legal a:hover span{border-color:var(--bone-3)}
footer.site-footer .sep{color:var(--bone-4);font-size:14px}
</style>
</head>
<body>
<div class="content">
<div class="mark">Anna Greyhem</div>
<div class="countdown" id="countdown">
<div class="unit"><div class="num" id="d">00</div><div class="lbl">Days</div></div>
<div class="sep">:</div>
<div class="unit"><div class="num" id="h">00</div><div class="lbl">Hrs</div></div>
<div class="sep">:</div>
<div class="unit"><div class="num" id="m">00</div><div class="lbl">Min</div></div>
<div class="sep">:</div>
<div class="unit"><div class="num" id="s">00</div><div class="lbl">Sec</div></div>
</div>
<div class="tagline">Some doors open on their own.<br>Others don't.</div>
<form class="gate" id="gateForm" autocomplete="off">
<div class="gate-row">
<input type="password" id="pw" placeholder="the password" autocomplete="off" />
<button type="submit" aria-label="confirm">&#8594;</button>
</div>
<div class="msg" id="msg"></div>
</form>
</div>
<footer class="site-footer">
<span class="foot-mark">Anna <em>Greyhem</em></span>
<span class="sep">·</span>
<div class="foot-legal">
<a href="/impressum/"><span>Legal Notice</span></a>
<span class="sep">·</span>
<a href="/datenschutz/"><span>Privacy Policy</span></a>
</div>
</footer>
<script>
var target = new Date('2026-09-25T22:00:00+02:00');
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  var diff = target - new Date();
  if (diff < 0) diff = 0;
  var d = Math.floor(diff / 86400000);
  var h = Math.floor(diff % 86400000 / 3600000);
  var m = Math.floor(diff % 3600000 / 60000);
  var s = Math.floor(diff % 60000 / 1000);
  document.getElementById('d').textContent = pad(d);
  document.getElementById('h').textContent = pad(h);
  document.getElementById('m').textContent = pad(m);
  document.getElementById('s').textContent = pad(s);
}
tick(); setInterval(tick, 1000);

var form = document.getElementById('gateForm');
var pw = document.getElementById('pw');
var msg = document.getElementById('msg');
form.addEventListener('submit', function(e){
  e.preventDefault();
  var val = pw.value.trim().toLowerCase();
  if (val === 'howlifefeels') {
    localStorage.setItem('ag-unlocked', 'true');
    window.location.href = 'revealed/index.html';
  } else if (val === 'h') {
    window.location.href = 'revealed-h/index.html';
  } else if (val === 'ho') {
    window.location.href = 'revealed-ho/index.html';
  } else if (val === 'how') {
    window.location.href = 'revealed-how/index.html';
  } else if (val === 'howl') {
    window.location.href = 'revealed-howl/index.html';
  } else if (val === 'howli') {
    window.location.href = 'revealed-howli/index.html';
  } else if (val === 'howlif') {
    window.location.href = 'revealed-howlif/index.html';
  } else {
    pw.classList.add('err','shake');
    msg.textContent = 'incorrect.';
    msg.classList.add('show');
    setTimeout(function(){ pw.classList.remove('shake'); }, 300);
  }
});
pw.addEventListener('input', function(){
  pw.classList.remove('err');
  msg.classList.remove('show');
});
</script>
<script data-goatcounter="https://annagreyhem.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
